[package]
# This must be rustapp for now.
name = "rustapp"
version = "0.1.0"
edition = "2021"
description = "Test embedded-hal-async digital::Wait on gpio pins"
license = "Apache-2.0 or MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
zephyr = { version = "0.1.0", features = ["time-driver", "executor-zephyr", "embedded-hal-async"] }
zephyr-panic = "0.1.0"
static_cell = "2.1"
embedded-hal-async = "1.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"

[dependencies.embassy-time]
version = "0.5.1"
features = ["tick-hz-10_000"]

[profile.release]
debug = true
